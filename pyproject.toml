[project]
name = "fedresearch"
version = "0.1.0"
description = "Agentic research assistant over federated biomedical data, with privacy guardrails and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0,<2.2",
    "pandas>=2.2,<2.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14,<1.15",
    "statsmodels>=0.14,<0.15",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedresearch"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
